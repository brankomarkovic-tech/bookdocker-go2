<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookDocker GO2</title>
    <meta name="description" content="A meeting point for book lovers and experts to present their collections of used books for sale. Connect with 'GO2' experts in various genres, browse their curated lists, and contact them directly to purchase.">
    <meta property="og:title" content="BookDocker GO2">
    <meta property="og:description" content="A meeting point for book lovers and experts to present their collections of used books for sale. Connect with 'GO2' experts in various genres, browse their curated lists, and contact them directly to purchase.">
    <link rel="icon" href="data:image/svg+xml,<svg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'><g><circle cx='12' cy='7' r='5' fill='%2351ADC9'/><path d='M4 12 L12 17 L20 12 L18 12 L12 15 L6 12 Z' fill='black' /><rect x='4' y='17' width='16' height='3' fill='%2351ADC9' /><rect x='4' y='20' width='16' height='3' fill='black' /></g></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Polyfill process.env for libraries that rely on it
        window.process = window.process || { env: {} };

        tailwind.config = {
          theme: {
            extend: {
              colors: {
                customBlue: {
                  DEFAULT: '#51ADC9',
                  100: '#e9f6f9',
                  600: '#51ADC9',
                  700: '#3c96b3',
                  800: '#327c96',
                }
              },
              animation: {
                'fade-in': 'fadeIn 0.5s ease-out',
              },
              keyframes: {
                fadeIn: {
                  '0%': { opacity: '0', transform: 'translateY(10px)' },
                  '100%': { opacity: '1', transform: 'translateY(0)' },
                }
              }
            }
          }
        }
    </script>
    <style>
        /* For Webkit-based browsers (Chrome, Safari) */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* For Firefox */
        html {
            scrollbar-width: thin;
            scrollbar-color: #888 #f1f1f1;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
